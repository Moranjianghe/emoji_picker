<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172a35">
  <meta name="description" content="簡潔好用的 emoji 拾取器，搜尋並複製常用表情符號。支援繁體中文、簡體中文與英文。">
  <title>表情小島 — Emoji 拾取器</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <a class="brand" href="#top" aria-label="表情小島首頁">
        <span class="brand-mark" aria-hidden="true">☺</span>
        <span>表情小島</span>
      </a>
      <span class="masthead-note">挑一個表情，傳達此刻心情</span>
    </header>

    <section class="intro" id="top" aria-labelledby="page-title">
      <div class="intro-copy">
        <p class="eyebrow">Emoji 拾取器</p>
        <h1 id="page-title">一個表情，<br>剛好說出心情。</h1>
        <p class="intro-text">找喜歡的 emoji，點一下就能複製。</p>
      </div>
      <div class="island-doodle" aria-hidden="true">
        <span class="sun">✳</span><span class="wave wave-one">〜〜</span>
        <span class="wave wave-two">〜〜〜</span><span class="tiny-face">🌴 😎 🌊</span>
      </div>
    </section>

    <section class="search-panel" aria-label="搜尋 emoji">
      <label class="search-label" for="search-input">搜尋 emoji</label>
      <div class="search-field">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        <input id="search-input" type="search" placeholder="試試：開心 / 开心 / happy" autocomplete="off" spellcheck="false">
        <button class="clear-search" type="button" aria-label="清除搜尋" hidden>清除</button>
      </div>
      <div class="search-hints" aria-label="熱門搜尋">
        <span>熱門</span>
        <button type="button" data-query="happy">happy</button>
        <button type="button" data-query="愛心">愛心</button>
        <button type="button" data-query="食物">食物</button>
      </div>
    </section>

    <section class="recent-section" aria-labelledby="recent-title">
      <div class="section-heading compact-heading">
        <div><span class="section-kicker">最近用過</span><h2 id="recent-title">最近使用</h2></div>
        <button id="clear-recent" class="text-button" type="button" hidden>清空</button>
      </div>
      <div id="recent-list" class="emoji-grid recent-grid" aria-live="polite"></div>
      <p id="recent-empty" class="recent-empty">複製過的 emoji 會留在這裡。</p>
    </section>

    <section class="library-section" aria-labelledby="library-title">
      <div class="section-heading library-heading">
        <div><span class="section-kicker">Emoji 表情庫</span><h2 id="library-title">全部表情</h2></div>
        <span id="result-count" class="result-count" aria-live="polite"></span>
      </div>
      <nav id="category-tabs" class="category-tabs" aria-label="Emoji 類別"></nav>
      <div id="emoji-groups"></div>
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-face" aria-hidden="true">🔎</span>
        <p>沒有找到符合的 emoji</p>
        <span>換個關鍵字，或試試「happy」「愛心」「食物」。</span>
      </div>
    </section>

    <footer class="page-footer">
      <span>表情小島 · 找到、複製、貼上</span>
      <a href="https://github.com/Moranjianghe/emoji_picker" target="_blank" rel="noreferrer">專案原始碼</a>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
